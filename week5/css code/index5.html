<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>
    <link rel="stylesheet" href="index5.css">
</head>
<body>
    <main class="browser-window">
        <p class="window-label">EXPECTED OUTPUT (BROWSER)</p>
        <div class="browser-bar" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <div class="page-content">
            <header class="hero">
                <h1>Tech Club</h1>
                <p>Learn. Code. Grow.</p>
            </header>

            <section class="panel events" aria-labelledby="events-title">
                <h2 id="events-title">Upcoming Events</h2>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Event</th>
                                <th scope="col">Date</th>
                                <th scope="col">Venue</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>HTML Workshop</td>
                                <td>12 Nov</td>
                                <td>Lab 1</td>
                            </tr>
                            <tr>
                                <td>Hackathon</td>
                                <td>20 Nov</td>
                                <td>Seminar Hall</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="panel registration" aria-labelledby="register-title">
                <h2 id="register-title">Register</h2>
                <form action="#" method="get">
                    <label for="name">Name:</label>
                    <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>

                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

                    <button type="submit">Register</button>
                </form>
            </section>
            
        </div>
    </main>
</body>
</html>
