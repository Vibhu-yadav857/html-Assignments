<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Page</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <main class="browser-window">
        <p class="window-label">EXPECTED OUTPUT (BROWSER)</p>

        <div class="browser-bar" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <header class="page-header">My Profile Page</header>

        <section class="page-content" aria-label="Profile">
            <article class="profile-card">
                <div class="avatar" aria-hidden="true">V</div>
                <h1>Vibhu Yadav</h1>
                <p class="role">Web Developer in Making</p>
                <p class="bio">
                    Hi! I am Vibhu. I started coding this year. I like making small
                    websites, drawing and listening to music. My goal is to build my
                    own app.
                </p>
            </article>

            <span class="add-icon" aria-hidden="true">+</span>
        </section>
    </main>
</body>
</html>
